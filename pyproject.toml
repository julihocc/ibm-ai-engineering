[project]
name = "ibm-ai-engineering"
version = "0.1.0"
description = "Coursera IBM AI Engineering Professional Certificate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib==3.9.3",
    "nltk>=3.9.2",
    "notebook>=7.5.0",
    "numpy==1.26",
    "pandas==2.2.3",
    "scikit-learn==1.6.0",
    "sentencepiece>=0.2.1",
    "spacy[models]>=3.8.11",
    # torch and torchtext: ensure compatibility
    # torch 2.2+ requires torchtext 0.18+
    "torch>=2.2.0,<3.0.0",
    "torchtext>=0.18.0,<1.0.0",
    "transformers==4.42.1",
]

[project.optional-dependencies]
# Optional dependencies for specific use cases
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]
